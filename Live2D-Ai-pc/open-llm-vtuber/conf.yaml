# Live2D-Ai — 独立直连 API 模式配置（精简版）
# ===========================================================
# 保留清单: deepseek_llm(默认) | zhipu_llm | qwen_llm | edge_tts | faster_whisper | silero_vad
# 不走任何中间 Gateway，直接调各厂商官方 API。
# ===========================================================
# 密钥策略（2026-08-20 起）：**不内置任何共享/免费 Key，也不提供免费兜底 Provider**。
# llm_api_key 一律写 ${XXX_API_KEY} 占位符，真实值放仓库根 .env（gitignore，由
# run_server.py 经 python-dotenv 载入）。环境变量未设置时占位符会被原样保留，
# 此时 api_key_resolver.py 会在构造 LLM 前抛出带配置指引的报错（不再静默回退）。

system_config:
  conf_version: 'v1.2.1'
  host: '0.0.0.0'
  port: 12393
  live2d_fps: 120
  config_alts_dir: 'characters'
  tool_prompts:
    live2d_expression_prompt: 'live2d_expression_prompt'
    mcp_prompt: 'mcp_prompt'

character_config:
  conf_name: 'bai'
  conf_uid: 'bai_001'
  live2d_model_name: 'bai'
  character_name: '白'
  avatar: 'mao.png'
  human_name: 'Human'
  load_persona_from_file: 'shared/persona.yaml'

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'
    agent_settings:
      basic_memory_agent:
        # 默认 DeepSeek（本地 .env 配置 DEEPSEEK_API_KEY；密钥不提交）。
        # 也可改为 'zhipu_llm' / 'qwen_llm' 等，并配置对应的 API Key。
        llm_provider: 'deepseek_llm'
        faster_first_response: true
        segment_method: 'priority'
        use_mcpp: false
        mcp_enabled_servers: []

    llm_configs:
      deepseek_llm:
        llm_api_key: '${DEEPSEEK_API_KEY}'
        model: 'deepseek-v4-flash'
        temperature: 0.8

        base_url: https://api.deepseek.com/v1
      qwen_llm:
        llm_api_key: '${DASHSCOPE_API_KEY}'
        base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
        model: 'qwen3.7-flash'
        temperature: 0.8

      zhipu_llm:
        llm_api_key: '${ZHIPU_API_KEY}'
        model: 'glm-4.6v'
        temperature: 1

        base_url: https://open.bigmodel.cn/api/paas/v4
  asr_config:
    asr_model: 'faster_whisper'  # P0: 启用本地 Faster-Whisper 语音输入；如无模型可改回 disabled
    faster_whisper:
      model_path: 'large-v3-turbo'
      download_root: 'models/whisper'
      language: 'zh'
      device: 'auto'
      compute_type: 'int8'
      prompt: ''

  tts_config:
    tts_model: 'cosyvoice_cloud'
    concurrency_limit: 2  # 段级 TTS 合成并发上限（spoq-fix P2-3）
    cosyvoice_cloud:
      api_key: ''
      model: 'cosyvoice-v1'
      ws_url: 'wss://ws-s8erlxkb5f8b1j59.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference'
    qwen_tts:
      api_key: '${DASHSCOPE_API_KEY}'
      voice: 'Cherry'
      model: 'qwen3-tts-flash'
    edge_tts:
      voice: 'zh-CN-XiaoxiaoNeural'

  vad_config:
    vad_model:
    silero_vad:
      orig_sr: 16000
      target_sr: 16000
      prob_threshold: 0.4
      db_threshold: 60
      required_hits: 3
      required_misses: 24
      smoothing_window: 5

  tts_preprocessor_config:
    remove_special_char: true
    ignore_brackets: true
    ignore_parentheses: true
    ignore_asterisks: true
    ignore_angle_brackets: true
    translator_config:
      translate_audio: false
      translate_provider: 'deeplx'

vision_config:
  vision_enabled: false
  provider: 'zhipu'
  api_key: '${ZHIPU_API_KEY}'
  model: 'glm-4.6v'
  capture_interval: 5.0

# MCP 服务定义: 直接指向跨端共享定义文件（零配置，无需本地手工创建 mcp_servers.json）
mcp_servers: 'shared/mcp_tools.json'
