        - glm-4.6v
        - glm-4.7-flash
  asr_config:
    asr_model: 'faster_whisper'  # P0: 启用本地 Faster-Whisper 语音输入；如无模型可改回 disabled
    faster_whisper:
      model_path: 'large-v3-turbo'
      download_root: 'models/whisper'
      language: 'zh'
      device: 'auto'
      compute_type: 'int8'
      prompt: ''

  tts_config:
    tts_model: 'melo_tts'
    concurrency_limit: 2  # 段级 TTS 合成并发上限（spoq-fix P2-3）
    cosyvoice_cloud:
      api_key: ''
      model: 'cosyvoice-v1'
      ws_url: 'wss://ws-s8erlxkb5f8b1j59.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference'
      voice: longxiaochun
      voices:
      - longxiaochun
      - longxiaoxia
      - longshu
      - longcheng
      - longhua
      - longyu
      - longmei
      - longyi
      models:
      - cosyvoice-v1
    melo_tts:
      language: 'ZH'
      device: 'cpu'
      speaker: ''
      speed: 0.8
      sdp_ratio: 0.2
      noise_scale: 0.8
      noise_scale_w: 0.8
      format: 'wav'
      voices:
      - ZH
      - EN
      - ES
      - FR
      - JP
      - KR
      models:
      - cpu
      - cuda
      - auto
    qwen_tts:
      api_key: '${DASHSCOPE_API_KEY}'
      voice: 'Cherry'
      model: 'qwen3-tts-flash'
      voices:
      - Cherry
      - Ethan
      - Serena
      - Charlotte
      models:
      - qwen3-tts-flash
    edge_tts:
      voice: 'zh-CN-XiaoxiaoNeural'

      voices:
      - zh-CN-XiaoxiaoNeural
      - zh-CN-XiaoyiNeural
      - zh-CN-YunjianNeural
      - zh-CN-YunxiNeural
      - zh-CN-YunxiaNeural
      - zh-CN-liaoning-XiaobeiNeural
      - zh-CN-shaanxi-XiaoniNeural
      - en-US-JennyNeural
      - en-US-GuyNeural
      - ja-JP-NanamiNeural
      - ko-KR-SunHiNeural
    viseme_mode: rms
  vad_config:
    vad_model:
    silero_vad:
      orig_sr: 16000
      target_sr: 16000
      prob_threshold: 0.4
      db_threshold: 60
      required_hits: 3
      required_misses: 24
      smoothing_window: 5

  tts_preprocessor_config:
    remove_special_char: true
    ignore_brackets: true
    ignore_parentheses: true
    ignore_asterisks: true
    ignore_angle_brackets: true
    translator_config:
      translate_audio: false
      translate_provider: 'deeplx'

vision_config:
  vision_enabled: false
  provider: 'zhipu'
  api_key: '${ZHIPU_API_KEY}'
  model: 'glm-4.6v'
  capture_interval: 5.0

# MCP 服务定义: 直接指向跨端共享定义文件（零配置，无需本地手工创建 mcp_servers.json）
mcp_servers: 'shared/mcp_tools.json'
