# Live2D-Ai — 独立直连 API 模式配置（精简版）
# ===========================================================
# 保留清单: deepseek_llm(默认) | zhipu_llm | qwen_llm | edge_tts | faster_whisper | silero_vad
# 不走任何中间 Gateway，直接调各厂商官方 API。
# ===========================================================
# 密钥策略（2026-08-20 起）：**不内置任何共享/免费 Key，也不提供免费兜底 Provider**。
# llm_api_key 一律写 ${XXX_API_KEY} 占位符，真实值放仓库根 .env（gitignore，由
# run_server.py 经 python-dotenv 载入）。环境变量未设置时占位符会被原样保留，
# 此时 api_key_resolver.py 会在构造 LLM 前抛出带配置指引的报错（不再静默回退）。

system_config:
  conf_version: 'v1.2.1'
  host: '0.0.0.0'
  port: 12393
  live2d_fps: 120
  config_alts_dir: 'characters'
  # PC v4 表情/动作导演（可选）：把 joy 等表情/动作从主对话脑分流到独立 LLM。
  # 缺省不写时沿用主对话脑的 provider/model（独立实例）；要换模型时取消注释：
  # director_llm_provider: 'qwen_llm'
  # director_model: 'qwen3.7-flash'
  tool_prompts:
    live2d_expression_prompt: 'live2d_expression_prompt'
    mcp_prompt: 'mcp_prompt'

character_config:
  conf_name: 'bai'
  conf_uid: 'bai_001'
  live2d_model_name: 'bai'
  character_name: '白'
  avatar: 'mao.png'
  human_name: 'Human'
  load_persona_from_file: 'shared/persona.yaml'

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'
    agent_settings:
      basic_memory_agent:
        # 默认 DeepSeek（本地 .env 配置 DEEPSEEK_API_KEY；密钥不提交）。
        # 也可改为 'zhipu_llm' / 'qwen_llm' 等，并配置对应的 API Key。
        llm_provider: 'deepseek_llm'
        faster_first_response: true
        segment_method: 'priority'
        use_mcpp: false
        mcp_enabled_servers: []

    llm_configs:
      deepseek_llm:
        llm_api_key: '${DEEPSEEK_API_KEY}'
        # 默认主模型带视觉（官方实验模型，同 key 同端点）；思考默认关（桌宠低延迟）
        model: 'deepseek-v4-flash-vision-exp'
        temperature: 0.8

        base_url: https://api.deepseek.com/v1
        models:
        - deepseek-v4-flash-vision-exp
        - deepseek-v4-flash
        - deepseek-v4-pro
      zhipu_free_llm:
        llm_api_key: '${ZHIPU_API_KEY}'
        model: 'glm-4.7-flash'
        temperature: 0.8

        base_url: https://open.bigmodel.cn/api/paas/v4
        models:
        - glm-4.7-flash
