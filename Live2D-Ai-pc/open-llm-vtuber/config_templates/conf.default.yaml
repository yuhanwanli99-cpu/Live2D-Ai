# Live2D-Ai — PC-only Preview default configuration (safe, no local models, no bundled keys)
# =========================================================================================
# This template is the source of defaults for new installations and configuration upgrades.
#
# Default policy:
#   - Bind to 127.0.0.1 (localhost only)
#   - ASR / VAD disabled (no model download at startup)
#   - TTS uses Edge TTS (no API key required, needs internet)
#   - Developer mode disabled
#   - LLM keys use ${XXX_API_KEY} placeholders; real values go to the repo-root .env (gitignored)
#   - No Live2D model or Cubism Core is bundled; users must obtain and import them lawfully
# =========================================================================================

system_config:
  conf_version: 'v1.2.1'
  host: '127.0.0.1'
  port: 12393
  live2d_fps: 120
  config_alts_dir: 'characters'
  developer_mode: false

  tool_prompts:
    live2d_expression_prompt: 'live2d_expression_prompt'
    mcp_prompt: 'mcp_prompt'

character_config:
  conf_name: 'bai'
  conf_uid: 'bai_001'
  live2d_model_name: 'bai'
  character_name: 'Bai'
  avatar: 'mao.png'
  human_name: 'Human'
  # persona_prompt placeholder; run_server.py overwrites it with shared/persona.yaml at startup.
  persona_prompt: 'Please edit the persona in shared/persona.yaml.'
  load_persona_from_file: 'shared/persona.yaml'

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'
    agent_settings:
      basic_memory_agent:
        llm_provider: 'deepseek_llm'
        faster_first_response: true
        segment_method: 'priority'
        use_mcpp: false
        mcp_enabled_servers: []

    llm_configs:
      deepseek_llm:
        llm_api_key: '${DEEPSEEK_API_KEY}'
        model: 'deepseek-v4-flash'
        base_url: https://api.deepseek.com/v1
        temperature: 0.8
        thinking_enabled: false
        models:
        - deepseek-v4-flash
        - deepseek-v4-pro

      zhipu_free_llm:
        llm_api_key: '${ZHIPU_API_KEY}'
        model: 'glm-4.7-flash'
        base_url: https://open.bigmodel.cn/api/paas/v4
        temperature: 0.8
        thinking_enabled: false
        models:
        - glm-4.7-flash

      qwen_llm:
        llm_api_key: '${DASHSCOPE_API_KEY}'
        model: 'qwen3.7-flash'
        base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
        temperature: 0.8
        thinking_enabled: false
        models:
        - qwen3.7-flash

  asr_config:
    asr_model: 'disabled'
    faster_whisper:
      model_path: 'large-v3-turbo'
      download_root: 'models/whisper'
      language: 'zh'
      device: 'auto'
      compute_type: 'int8'
      prompt: ''

  tts_config:
    tts_model: 'edge_tts'
    concurrency_limit: 2
    edge_tts:
      voice: 'zh-CN-XiaoxiaoNeural'
      voices:
      - zh-CN-XiaoxiaoNeural
      - zh-CN-XiaoyiNeural
      - zh-CN-YunjianNeural
      - zh-CN-YunxiNeural
      - zh-CN-YunxiaNeural
      - zh-CN-liaoning-XiaobeiNeural
      - zh-CN-shaanxi-XiaoniNeural
      - en-US-JennyNeural
      - en-US-GuyNeural
      - ja-JP-NanamiNeural
      - ko-KR-SunHiNeural
    viseme_mode: 'rms'

  vad_config:
    vad_model:
    silero_vad:
      orig_sr: 16000
      target_sr: 16000
      prob_threshold: 0.4
      db_threshold: 60
      required_hits: 3
      required_misses: 24
      smoothing_window: 5

  tts_preprocessor_config:
    remove_special_char: true
    ignore_brackets: true
    ignore_parentheses: true
    ignore_asterisks: true
    ignore_angle_brackets: true
    translator_config:
      translate_audio: false
      translate_provider: 'deeplx'

vision_config:
  vision_enabled: false
  provider: 'zhipu'
  api_key: '${ZHIPU_API_KEY}'
  model: 'glm-4.6v'
  capture_interval: 5.0

mcp_servers: 'shared/mcp_tools.json'
