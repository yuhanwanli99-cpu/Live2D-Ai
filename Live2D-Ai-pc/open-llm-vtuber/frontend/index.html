<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Live2D-Ai — 白</title>
    <style>
      /* 仅保留"页面骨架"级样式：面板 / 气泡 / 背景层 / 提示条的样式全部在
         src/theme.css + src/chat.css（design token 统一，见
         docs/research/neko-ui-alignment-and-gaps.md P0-4），
         这里不再内联第二套色板与字号。 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 透明背景：配合 Electron/Tauri 桌面壳实现悬浮桌宠；
           Web 模式下由 #app-background 层承载用户上传的角色背景图 */
        background: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #canvas {
        position: relative;
        z-index: 1; /* 与 theme.css 的 --z-canvas 对齐：角色在背景层之上 */
        width: 100%;
        height: 100%;
      }
      #canvas canvas { display: block; }
    </style>
    <!-- Cubism 4 Core：必须早于 main.ts 加载（pixi-live2d-display 依赖全局 live2dcubismcore） -->
    <script src="./libs/live2dcubismcore.min.js"></script>
    <script>
      /* 永不静默崩溃：模块加载/运行首错直接画到页面上（先于主包执行） */
      (function () {
        function show(msg) {
          var el = document.getElementById('__boot_err');
          if (!el) {
            el = document.createElement('pre');
            el.id = '__boot_err';
            el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;' +
              'background:#b00020;color:#fff;padding:10px;font:12px/1.5 monospace;' +
              'white-space:pre-wrap;max-height:45%;overflow:auto';
            document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
          }
          el.textContent += msg + '\n';
        }
        window.addEventListener('error', function (e) { show('[error] ' + (e.message || e.type) + ' @' + (e.filename || '') + ':' + (e.lineno || '')); });
        /* 资源加载失败不冒泡：捕获阶段才能看到（如 chunk 404） */
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.src || t.href)) show('[resource] ' + (t.src || t.href));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { show('[promise] ' + ((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason))); });
        /* 入口 catch 显式调用：被 .catch 处理过的失败不会触发上面两个监听 */
        window.__showBootErr = show;
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-4gHtf1eW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DI3uD1A9.css">
  </head>
  <body>
    <!-- 角色背景图层（PixiJS 画布之下；无背景图时保持透明） -->
    <div id="app-background"></div>
    <div id="canvas"></div>
    <div id="chat"></div>
  </body>
</html>
