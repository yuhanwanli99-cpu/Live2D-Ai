# =============================================================================
# Secret Scan — 红线「密钥不进仓库」的自动门禁（审计 F-0049-01）
#
# 触发：所有 PR → main、push → main、workflow_dispatch。**没有 paths 过滤** ——
# 旧脚本的扫描面缺 shell/**（Dart）与 docs/**，而密钥恰恰可能落在那里；带路径
# 过滤的 workflow 还会让 docs-only 的 PR 完全绕过扫描。
#
# 实现：scripts/check_public_secrets.py（git ls-files 上的保守模式扫描：
# sk-… / ghp_… / AKIA… / PRIVATE KEY）。开销约 1 秒（937 个 tracked 文件）。
#
# **没有 Gitleaks**：本仓不存在任何 Gitleaks 配置，脚本 docstring 原先那句
# 「GitHub CI 额外会跑 Gitleaks 覆盖完整历史」是不成立的自我声明（F-0049-01），
# 已删除。**历史提交不在本门禁扫描面内** —— 这是已知缺口，不假装有网。
# =============================================================================
name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-secret-scan:
    name: Public Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan tracked tree for secret patterns
        run: python3 scripts/check_public_secrets.py
