# v0.7.0-rc.1：唯一 Windows 完整包路径。只上传 pack-windows.sh 的同一份
# zip + SHA256 + 发布说明/构建报告；不上传裸 exe，不创建 GitHub Release。
name: Release Build

on:
  push:
    tags: ["v0.7.0-rc.1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-complete-package:
    name: Windows complete package (v0.7.0-rc.1)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SIBLING_ROOT: ${{ runner.temp }}/live2d-ai-pack-siblings
    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Install Rust 1.98.1 and package targets
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          profile: minimal
          targets: x86_64-pc-windows-gnu, wasm32-unknown-unknown

      - name: Install Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install Trunk 0.21.14
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14

      - name: Install GNU cross-linker and Linux build headers
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            mingw-w64 libasound2-dev pkg-config
          x86_64-w64-mingw32-gcc --version
          pkg-config --modversion alsa

      # PINNED/INFO 只在打包脚本维护。完整克隆引用但按需取 blob，随后硬校验
      # checkout 的完整 SHA；缺仓库或缺 pin 都直接失败，不回退 HEAD。
      - name: Checkout six Mod repositories at pack script pins
        run: |
          set -euo pipefail
          mkdir -p "$SIBLING_ROOT"
          python3 - <<'PY' > "$RUNNER_TEMP/live2d-ai-mod-pins.tsv"
          from scripts.pack_windows_glue import INFO, MOD_NAMES, PINNED
          for name in MOD_NAMES:
              print(f"{INFO[name][0]}\t{PINNED[name]}")
          PY
          while IFS=$'\t' read -r repo sha; do
            git clone --quiet --filter=blob:none --no-checkout \
              "https://github.com/yuhanwanli99-cpu/${repo}.git" "$SIBLING_ROOT/$repo"
            git -C "$SIBLING_ROOT/$repo" checkout --detach "$sha"
            test "$(git -C "$SIBLING_ROOT/$repo" rev-parse HEAD)" = "$sha"
          done < "$RUNNER_TEMP/live2d-ai-mod-pins.tsv"

      - name: Build and verify the complete package through the single entrypoint
        run: |
          set -euo pipefail
          ./scripts/pack-windows.sh \
            --base "$GITHUB_SHA" \
            --sibling-root "$SIBLING_ROOT" \
            --flutter-bin "$(command -v flutter)"

      - name: Verify SHA256 with standard sha256sum
        working-directory: dist
        run: sha256sum -c live2d-ai-windows-0.7.0-rc.1.zip.sha256

      - name: Collect release notes
        run: cp docs/versions/0.7.md dist/RELEASE_NOTES.md

      - name: Upload the same zip, SHA256 and required notes
        uses: actions/upload-artifact@v4
        with:
          name: live2d-ai-windows-0.7.0-rc.1
          path: |
            dist/live2d-ai-windows-0.7.0-rc.1.zip
            dist/live2d-ai-windows-0.7.0-rc.1.zip.sha256
            dist/RELEASE_NOTES.md
            dist/pack-logs/report-*.txt
          if-no-files-found: error
          retention-days: 60
          compression-level: 0

      - name: Build summary
        run: |
          {
            echo "## Windows complete package — v0.7.0-rc.1"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Entrypoint: scripts/pack-windows.sh"
            echo "- Artifact: live2d-ai-windows-0.7.0-rc.1.zip + .zip.sha256"
            echo "- GitHub Release creation: not performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
