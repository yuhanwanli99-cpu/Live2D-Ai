# =============================================================================
# Flutter Checks — 前端门禁（shell/flutter/** + crates/*/src/**）
#
# 前端/接口层豁免 rust-ratio（见 AGENTS.md「前端层豁免的理由」），质量门槛由
# Flutter 自己的工具链承担：flutter analyze（静态检查）+ flutter test（含帧解析、
# 音频调度、气泡渲染等纯逻辑与 widget 回归）。
#
# 触发范围 = `shell/flutter/**` **或** `crates/*/src/**`：
# 后者是 2026-10-01（W1-d，审计 F-0005-5）补上的一半缺口——
# `test/font_runtime_subset_test.dart` 的字体**运行态**子集门禁会真扫
# `../../crates/*/src` 的后端文案字面量（WS error 帧 / settings / web_api /
# Mod `settings_spec`），只改后端文案的 PR 必须在 CI 里就被拦住，而不是等下一次
# 前端改动才暴露。粒度收在 `src/`：Rust 侧的 `tests/**`、`examples/**`、
# `README.md`、`Cargo.toml` 变更**不触发**本工作流（门禁本身也跳过 Rust 测试
# 源码，口径一致）；`*` 通配所有 crate，这样新增 `live2d-ai-mod-*` crate 时
# 该文件里「每个 Mod crate 都要在覆盖面内」的对账也真的会跑。
#
# 纯 Rust/文档 PR 仍然不必等 Flutter 工具链（这是本工作流与 pr-checks.yml 的分工）。
# 与本地门禁逐条一致（AGENTS.md「本地必跑 vs CI 必跑」表）。
# =============================================================================
name: Flutter Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "shell/flutter/**"
      - "crates/*/src/**"
      - ".github/workflows/flutter-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze-test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable) + cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: shell/flutter
        run: flutter pub get

      - name: Analyze
        working-directory: shell/flutter
        run: flutter analyze

      - name: Test
        working-directory: shell/flutter
        run: flutter test

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: 前端**产物级**离线门禁（审计 F-0048-01 / F-0050-01）
  #
  # 红线 K（离线优先）：--no-web-resources-cdn 是**唯一**决定 CanvasKit 是否指向
  # www.gstatic.com 的开关。缺省构建会把浏览器对 CanvasKit 的请求打到 Google CDN，
  # 而 build/web/canvaskit/ 那份本地副本不被引用 ⇒ **断网即白屏**（本地优先的桌宠
  # 不允许依赖 Google CDN）。
  #
  # 补洞前的状态：5 个 workflow 穷举下来零 flutter build、零产物 grep（F-0048-01），
  # 而唯一会 grep 产物的 ignite.sh --check 又探错了文件（F-0050-01：index.html /
  # main.dart.js 对 CDN 串命中 0，真正的决策在 flutter_bootstrap.js）。
  # 本 job 让「漏开关」在 CI 里当场变红；探针清单与判定在 scripts/ignite.sh 的
  # CDN_PROBE_SPEC / cdn_judge（**唯一真源**，--check 与 --check-dir 共用）。
  # ────────────────────────────────────────────────────────────────────────────
  flutter-web-offline-artifacts:
    name: Flutter Web Offline Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable) + cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: shell/flutter
        run: flutter pub get

      # 与 AGENTS.md / ignite.sh 同一口径：必须带 --no-web-resources-cdn。
      - name: "Build Flutter web (offline: no web resources CDN)"
        working-directory: shell/flutter
        run: flutter build web --release --base-href /app/ --no-web-resources-cdn

      # 产物级断言：探针文件缺失 = 红（F-0050-01 的教训：静默跳过 = 假绿）。
      - name: Offline artifact gate (no Google CDN CanvasKit)
        run: ./scripts/ignite.sh --check-dir shell/flutter/build/web
