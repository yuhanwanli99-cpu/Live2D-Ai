# =============================================================================
# Nightly — 夜间全量门禁（Rust 重构后）
# 触发器: cron (UTC 02:00) | workflow_dispatch
# Jobs:
#   - rust-full-test    : 全量 build/test(--all-targets)/doc/fmt/clippy + rust-ratio
#   - core-chain-verify : 端到端核心链探针（**opt-in**：仅在配置仓库变量
#                         LIVE2D_AI_VERIFY_BASE_URL 时跑；缺配置明确跳过，不伪造绿灯）
#   - rust-release-build: needs: rust-full-test，cargo build --release，上传 desktop 二进制
# =============================================================================
name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: 全量门禁 — build / test / fmt / clippy
  # ────────────────────────────────────────────────────────────────────────────
  rust-full-test:
    name: Rust Full Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      # doc 测试与 --all-targets 是两套目标：前者跑 rustdoc 示例，后者跑
      # bin/lib/tests/examples。只跑其一都会漏（本地门禁两条都跑）。
      - name: Test doc examples
        run: cargo test --doc --workspace

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 前端/接口层豁免 rust-ratio，但**分母仍在**——这条断言第一方 Rust 占比
      # 不低于 95%（xtask 会单独打印 Dart 行数，保证豁免可见而不是隐形）。
      - name: Rust ratio (>= 95%)
        run: cargo run -p xtask -- rust-ratio

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: 端到端核心链探针（**需要活的 LLM/TTS 端点**，故默认不跑）
  #
  # 它测的是真链路：POST /chat → LLM → TTS → 音频帧 → 口型。CI 里既没有上游端点
  # 也没有密钥，硬跑只会天天红——而「天天红」比没有这条更坏（AGENTS.md
  # 「自检与产品链路抢资源 → 自检说谎」是同一条教训）。
  #
  # 所以：配了仓库变量 `LIVE2D_AI_VERIFY_BASE_URL`（Variables，不是 Secrets——
  # 它只是地址）才跑；没配就**明确跳过**，绝不伪造绿灯。
  # ────────────────────────────────────────────────────────────────────────────
  core-chain-verify:
    name: Core Chain Verify (opt-in)
    needs: rust-full-test
    if: ${{ vars.LIVE2D_AI_VERIFY_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 脚本只用标准库（urllib），不需要 pip install。
      # 长思考提问需要更长窗口——所以带 --timeout 300（默认 90 会误判超时）。
      - name: Run core-chain probes
        env:
          LIVE2D_AI_BASE: ${{ vars.LIVE2D_AI_VERIFY_BASE_URL }}
        run: python3 scripts/verify_core_chain.py --timeout 300

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: 全量发布构建 — release desktop 二进制
  # ────────────────────────────────────────────────────────────────────────────
  rust-release-build:
    name: Rust Release Build
    needs: rust-full-test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (workspace)
        run: cargo build --release --workspace

      - name: Upload desktop binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: live2d-ai-nightly-${{ github.sha }}
          path: target/release/live2d-ai-desktop
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Nightly summary
        run: |
          echo "## Nightly Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 4: 前端产物「构建 → 起真服务 → ignite.sh --check」（审计 F-0048-01）
  #
  # 与 flutter-checks.yml 的产物级门禁互补：那条检查**文件**，这条检查**服务实吐
  # 字节**（curl 到的 HTTP 200 + 内容），把「托管层」也纳入验证。放 nightly 而不是
  # PR 门禁：它要编 live2d-ai-desktop（含 cpal/ALSA），耗时与系统依赖都不适合每个 PR。
  #
  # CI 里没有 LLM/TTS 端点 —— 服务以**缺省配置**起（不配 toml/.env、无模型库）。
  # 2026-10-05 本地以「空 cwd + 缺省配置 + 真二进制」实测：/app/ 首轮即 200，
  # ignite.sh --check 四项全绿。起不来就**失败**（打印服务日志），不伪造绿灯。
  #
  # 未在真 runner 上验证的一点：ubuntu-latest 是否自带 libasound2-dev。这里先探测、
  # 缺了才装（避免 build-upload.yml 里那个无条件 apt 步骤的反复 exit 100 形态）。
  # ────────────────────────────────────────────────────────────────────────────
  web-offline-serve-check:
    name: Web Offline Serve Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter (stable) + cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: shell/flutter
        run: flutter pub get

      - name: "Build Flutter web (offline: no web resources CDN)"
        working-directory: shell/flutter
        run: flutter build web --release --base-href /app/ --no-web-resources-cdn

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      # cpal 在 Linux 经 ALSA：先探测，缺了才装。
      - name: Ensure ALSA dev headers (cpal/ALSA on Linux)
        run: |
          if pkg-config --modversion alsa >/dev/null 2>&1; then
            echo "libasound2-dev 已在 runner 上，跳过 apt"
          else
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libasound2-dev pkg-config
          fi

      - name: Build desktop server binary
        run: cargo build -p live2d-ai-desktop

      - name: Start server (default config, loopback)
        env:
          LIVE2D_AI_FLUTTER_WEB_DIR: ${{ github.workspace }}/shell/flutter/build/web
          LIVE2D_AI_MUTE_AUDIO: "1"
        run: |
          ./target/debug/live2d-ai-desktop --web --http-port 18080 > /tmp/serve.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:18080/app/ || true)
            if [ "$code" = "200" ]; then up=1; echo "服务在第 $i 秒就绪"; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::服务 60s 内未就绪（/app/ 非 200）"
            tail -80 /tmp/serve.log
            exit 1
          fi

      # 真服务体检：/ → 302 /app/、/app/ → 200、四类产物文件离线判定。
      - name: Ignition check (hosting + offline red line)
        run: ./scripts/ignite.sh --check --port 18080

      - name: Server log (always)
        if: always()
        run: tail -120 /tmp/serve.log
