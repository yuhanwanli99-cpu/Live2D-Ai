# =============================================================================
# Build & Upload — APK 构建 + Artifact 上传
# 触发器: push → main | workflow_dispatch (手动)
# Job: build-apk
# =============================================================================
name: Build & Upload Artifact

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".pi/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        type: choice
        options:
          - debug
          - release
        default: "debug"

env:
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}

    outputs:
      apk_name: ${{ steps.metadata.outputs.apk_name }}
      apk_size_bytes: ${{ steps.metadata.outputs.apk_size_bytes }}
      build_duration_seconds: ${{ steps.metadata.outputs.build_duration_seconds }}
      commit_sha: ${{ steps.metadata.outputs.commit_sha }}
      build_type: ${{ steps.metadata.outputs.build_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install NDK r27 (${{ env.ANDROID_NDK_VERSION }})
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true
          local-cache: true

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew
        working-directory: Live2Dai-Android

      - name: Build APK
        id: build
        run: |
          BUILD_START=$(date +%s)
          if [[ "${{ github.event.inputs.build_type || 'debug' }}" == "release" ]]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
          BUILD_END=$(date +%s)
          echo "duration=$(( BUILD_END - BUILD_START ))" >> "$GITHUB_OUTPUT"
        working-directory: Live2Dai-Android

      - name: Collect APK metadata
        id: metadata
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          APK_PATH="app/build/outputs/apk/${BUILD_TYPE}/app-${BUILD_TYPE}.apk"
          APK_NAME="live2dai-android-${BUILD_TYPE}-${GITHUB_SHA::7}.apk"

          # Copy the real Gradle output to a friendly, unique name so the
          # upload step below has a stable path to reference (the raw
          # app-${BUILD_TYPE}.apk name is overwritten on every build).
          cp "$APK_PATH" "$APK_NAME"

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_size_bytes=$(stat -c%s "$APK_PATH" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          echo "build_duration_seconds=${{ steps.build.outputs.duration }}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"
        working-directory: Live2Dai-Android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: live2dai-android-${{ github.event.inputs.build_type || 'debug' }}-${{ github.sha }}
          path: Live2Dai-Android/${{ steps.metadata.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Build summary
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build type**: ${{ steps.metadata.outputs.build_type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Duration**: ${{ steps.metadata.outputs.build_duration_seconds }}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK size**: ${{ steps.metadata.outputs.apk_size_bytes }} bytes" >> "$GITHUB_STEP_SUMMARY"
