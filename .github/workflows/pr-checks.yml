# =============================================================================
# PR Checks — 门禁工作流
# 触发器: pull_request → main
# Jobs: android-test | python-test | lint
# =============================================================================
name: PR Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".pi/**"

# 取消同一 PR 的重复运行（快速推新 commit 时自动取消旧 run）
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job A: Android 单元测试 (JUnit + Robolectric)
  # ────────────────────────────────────────────────────────────────────────────
  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install NDK r27 (${{ env.ANDROID_NDK_VERSION }})
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew
        working-directory: Live2D-Ai-Android

      - name: Run Android unit tests
        run: ./gradlew test
        working-directory: Live2D-Ai-Android

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-android
          path: Live2D-Ai-Android/app/build/reports/tests/**
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job B: Python 桌面端测试 (pytest)
  # ────────────────────────────────────────────────────────────────────────────
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies and run Python tests
        run: |
          uv sync
          uv run pytest tests/ -v --junitxml=test-results.xml
        working-directory: Live2D-Ai-pc/open-llm-vtuber

      - name: Run local health check (no key)
        run: uv run --project Live2D-Ai-pc/open-llm-vtuber python scripts/health_check.py

      - name: Run cross-platform consistency
        run: uv run --project Live2D-Ai-pc/open-llm-vtuber python shared/check_cross_platform_consistency.py

      - name: Verify Android persona.yaml is synced with shared/
        run: |
          cmp -s shared/persona.yaml Live2D-Ai-Android/app/src/main/assets/persona.yaml || {
            echo "::error::Android assets/persona.yaml is out of sync with shared/persona.yaml"
            exit 1
          }

      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-python
          path: test-results.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job C: Lint 检查 (AGP 内置 lint + ruff Python lint)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant gradlew execute permission
        run: chmod +x gradlew
        working-directory: Live2D-Ai-Android

      - name: Run Android Lint (AGP built-in)
        run: ./gradlew lint
        working-directory: Live2D-Ai-Android
        continue-on-error: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run ruff check (Python)
        run: |
          uv run ruff check .
        working-directory: Live2D-Ai-pc/open-llm-vtuber
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            Live2D-Ai-Android/app/build/reports/lint-results-*.xml
            Live2D-Ai-Android/app/build/reports/lint-results-*.html
          retention-days: 7
