name: Bug report
description: Report a reproducible PC Preview problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste API keys, tokens, private chats, or unredacted logs."
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [WSL2, Ubuntu/Linux, Other/unsupported]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
