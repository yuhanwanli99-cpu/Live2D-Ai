<!DOCTYPE html>
<!-- l2d-wasm-demo 页面壳：canvas 渲染区 + <pre id="status"> 状态栏。
     trunk build 会把 wasm-bindgen 产物注入本文件；不引入任何第三方前端依赖。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live2D-Ai · l2d WASM demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #101418;
        color: #d7dde3;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #stage {
        flex: 1;
        min-height: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #status {
        margin: 0;
        padding: 8px 12px;
        max-height: 10em;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 12px;
        line-height: 1.5;
        color: #9fd0a0;
        border-top: 1px solid #2a323b;
      }
      #status.error {
        color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <pre id="status">初始化中…</pre>
  </body>
</html>
