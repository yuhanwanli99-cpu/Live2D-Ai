[package]
name = "live2d-ai-runtime"
description = "Live2D-Ai 最小统一 API 层：OpenAI-compatible LLM(SSE 流式) 与 TTS(chunked bytes) 客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
# 对话引擎（`conversation` 模块）的异步设施：
# - `sync`：有界 mpsc 队列（LLM→TTS worker 的背压边界）；
# - `rt`：`tokio::spawn` 单个 TTS worker 任务；
# - `time`：可选的队列推送超时（Backpressure 错误语义）；
# - `macros`：每个 await 点与取消令牌的 `select!`。
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros"] }
# 协作式取消令牌 `CancellationToken`。
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# 测试用本地 tokio TCP mock（额外需要 net/io-util 与多线程调度器）。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
] }

[lints]
workspace = true
