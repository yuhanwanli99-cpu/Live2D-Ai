[package]
name = "live2d-ai-desktop"
description = "Live2D-Ai PC 桌面服务（Web API + supervisor + WebSocket 事件流 + 声卡输出链路；同源托管 Flutter Web /app/。2026-10-01 W2-B：原生窗口壳/托盘/终端 chat/benchmark 已移出构建，见 docs/architecture/ARCHIVED-native-shell.md）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
authors.workspace = true

[dependencies]
# 2026-10-01（W2-B / D1 第二段）：`wgpu` / `winit` / `pollster` / `egui*` /
# `raw-window-handle` / `ksni` / `url` 九条依赖随原生壳岛移出而删除
# （恢复条件与依据见 docs/architecture/ARCHIVED-native-shell.md）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 日志落盘（W3 任务：CLI 启动附带；任何模式都落盘）：
# - tracing-appender 0.2（tokio-rs 官方配套，MIT）：按天滚动 + 自动
#   `live2d-ai.log.YYYY-MM-DD` 后缀 + `live2d-ai.log` 指向最新；轻量、零
#   依赖传递；脱敏走 logging.rs 的 SanitizingWriter 兜底。
# - 引入位置见 `crates/live2d-ai-desktop/src/logging.rs`。
# 许可证登记见 SOURCES.md。
tracing-appender = "0.2"
# Web API DTO / mods.json / 错误响应序列化。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 2026-10-05（W1-C / D4）：`serde_with` 已移除——它在本 crate 只剩
# `settings_routes::PatchBody` 的段级三态反序列化一处用处，现由本 crate 内的
# 十余行 `double_option` 助手承担（逐字同语义，见 web_api/settings_routes/mod.rs）；
# 不为一行反序列化挂一个直接依赖。runtime 侧仍用它自己的（未动）。
# 音频输出第一批（RFC §4 批次 4 部分）：实际声卡回放链路。
# cpal 0.18 MSRV 1.85 与工作区一致；Linux 后端经 ALSA（libasound2-dev）。
# ringbuf 提供跨线程无锁 SPSC 环形缓冲（生产者入队 / 回调消费），
# MSRV 与许可证见 SOURCES.md 登记。
cpal = "0.18"
live2d-ai-runtime = { path = "../live2d-ai-runtime" }
# l2d：模型库路由用它解析/加载皮套包（`l2d::asset::ModelPackage`，见
# web_api/models_routes）；core：主链状态机（epoch/双闩锁/root reducer）。
l2d = { path = "../l2d" }
live2d-ai-core = { path = "../live2d-ai-core" }
# 节点 E E4：Mod 系统（trait/factory/registry/services/status/topics）。
live2d-ai-mod-system = { path = "../live2d-ai-mod-system" }
# 0.2.0-rc.1：external-input 是缺省启用的 Mod（直播弹幕/礼物注入）——
# handler 复用它的纯函数（render_from_config / token_from_config）。
live2d-ai-mod-external-input = { path = "../live2d-ai-mod-external-input" }
# live2d-ai-mod-pet-desktop：依赖已移除（不再编译进 binary）；crate 本身已于
# 2026-10-01（W2-A / D1 第一段）**物理删除**，只存在于 tag
# `checkpoint/pre-d1-dormant` ⇒ **不要回来找它**，也**禁止**挂回 FACTORIES。
# live2d-ai-mod-local-llm：同上（0.2.0-rc.1 废除启动 → 2026-10-01 删除）。
# 理由与恢复条件见 docs/architecture/ARCHIVED-mods.md。
# rc.4 M5：角色卡标准 Mod（主链只留 system_prompt，卡字段由它合成写回）。
live2d-ai-mod-persona = { path = "../live2d-ai-mod-persona" }
# Wave 1（2026-09-14）：voice-input 骨架（语音转写 → 清洗 → say_tx）。
live2d-ai-mod-voice-input = { path = "../live2d-ai-mod-voice-input" }
# live2d-ai-mod-wallpaper：依赖已移除（不再编译进 binary）；crate 本身已于
# 2026-10-01（W2-A / D1 第一段）**物理删除**，只存在于 tag
# `checkpoint/pre-d1-dormant` ⇒ **不要回来找它**，也**禁止**挂回 FACTORIES。
# 用户手动的舞台/壳背景能力（DisplayPrefs）不经本 crate，因此不受影响。
# 见 docs/architecture/ARCHIVED-mods.md。
# Wave 2 C 轨（2026-09-14）：memory v0（本地 JSONL 记忆 + 词元重叠检索）。
# **本分支不注册**进 AVAILABLE_MOD_FACTORIES——注册由集成 PR 按
# docs/plans/parallel-mods/REGISTER-memory-v0.md 一次改到位；缺省停用。
live2d-ai-mod-memory = { path = "../live2d-ai-mod-memory" }
# Wave 3 G 轨（2026-09-14）：导演最小骨架（正文 → 情绪/意图/TTS 建议；只记日志 +
# state_json，**零投递**）。**缺省停用**；注册由集成 PR（本波主 agent）一次改到位。
live2d-ai-mod-director = { path = "../live2d-ai-mod-director" }
ringbuf = "0.5"
# supervisor 的异步设施。
# - current_thread runtime 跑在独立 OS 线程；
# - `macros` 提供 select!（引擎事件/控制/排空观察的扇入）；
# - `sync` 提供有界 Say 通道与引擎事件通道；
# - 取消令牌（`CancellationToken`）经 `live2d_ai_runtime::CancellationToken`
#   取用：本 crate **不再**直接依赖 `tokio-util`（2026-10-05 W1-C / D4）。
#   令牌语义属于 runtime 的对话引擎（`run_turn` 的公开签名），消费方不该
#   另挂一条同款依赖。crate 仍在构建图里（经 runtime），删掉的是这条多余直边。
tokio = { version = "1", default-features = false, features = ["sync", "rt", "time", "macros"] }
# D2 HTTP 接线（节点 D 后端层，2026-08-28）：
# - tiny_http 0.12（纯 Rust，无 TLS、零 async 运行时、循环回环绑定即用）：
#   比 axum 省 5+ 传递依赖（hyper/tower-http/matchit 等），本场景仅 21 个端点
#   + loopback 默认端口路由表手写即可；handler 同步阻塞适合 supervisor 之外
#   的控制平面命令路径（控制命令不抢 supervisor 线程）。
# - 不复用 supervisor 的 tokio runtime：HTTP 与 supervisor 解耦，互不阻塞；
#   PATCH settings 后的"配置变更通知"经 mpsc 单向通知，supervisor 在下一个
#   turn 边界自行重建 OpenAiClient。
tiny_http = "0.12"
# 端口号解析 + 控制命令的 mpsc（与 supervisor 共享的 `tokio` runtime 之外的
# std mpsc 足以；避免再引 sync_channel crate）。
once_cell = { version = "1", default-features = false }
# 2026-09-12（rc.2）：`directories` 依赖已移除——它只剩「模型 registry 走 XDG」这一处
# 用处，而模型根已统一为仓库 `assets/models/`（见 `web_api/model_root.rs`）。
# 配置文件路径解析本来就不走它（走显式路径 + cwd 相对候选）。
# D2 HTTP server 接线（节点 D 后端层，2026-08-28）：
# - reqwest 0.12 仅用于 settings/test/{llm,tts} 端点直接发测试请求——
#   runtime 的 `OpenAiClient::new` 不暴露 `from_parts`（私有字段），
#   且默认构造的 reqwest::Client 无 timeout，故 test 端点走独立 client。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 2026-10-05（W1-C / D4）：`futures-util` 已移除——它在本 crate 只剩
# `test_endpoints` 里读一次 SSE 流的一行 `StreamExt::next()`；reqwest 自带的
# `Response::chunk()` 就是「取下一片」，语义相同，不再为此单独挂依赖。
# WebSocket 桥（W2 任务，2026-08-29）：
# - tungstenite 0.24 纯 Rust WS 实现（MIT/Apache-2.0，仓库根 LICENSE 双许可确认），
#   `default-features = true` 仅启用 `handshake` 子集（不需要 TLS/async），
#   可与 tiny_http 0.12 的 `Request::upgrade` 拼装：
#   `tungstenite::accept(stream)` 直接对升级后的 `Box<dyn ReadWrite + Send>` 走
#   服务端握手。该组合避免了引入 hyper/tower 整条 axum 生态（与 D2 选型一致：
#   依赖最小化）。引入位置：`web_api/ws.rs`（生产 Server 角色）；测试走 `connect()`
#   也用本 crate（无 `url` feature 时连接需手动构造 header，本任务不依赖 url feature）。
tungstenite = { version = "0.24" }
# 文件监听热重载（2026-08-31）：`notify` 8.x 跨平台文件事件监听（inotify/FSEvents/ReadDirectoryChangesW），
# 用于检测 `live2d-ai.toml` 外部修改并触发 supervisor reload。
notify = "8"

[dev-dependencies]
# 仅供测试；生产路径下由 main.rs 在 [dependencies] 直接使用。

[lints]
workspace = true
