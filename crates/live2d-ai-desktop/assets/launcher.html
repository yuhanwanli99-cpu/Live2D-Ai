<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="live2d-ai-launcher" content="0.3.11">
<title>Live2D-Ai</title>
<style>
  @font-face {
    font-family: "LauncherSC";
    src: url("/launcher/NotoSansSC-AiSubset-Regular.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --bg: #10131a;
    --card: #171b24;
    --line: #262c39;
    --text: #e7ebf3;
    --muted: #98a2b3;
    --accent: #5ad1c8;
    --accent-2: #7aa7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2230 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "LauncherSC", "Noto Sans SC", system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.5px;
  }
  .tagline {
    margin: 6px 0 22px;
    color: var(--muted);
    font-size: 13px;
  }
  .figures {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .figure {
    background: #121620;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .figure-label {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .figure strong {
    font-size: 26px;
    font-weight: 600;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .switch {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    font-size: 14px;
  }
  .switch input { width: 16px; height: 16px; accent-color: var(--accent); }
  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  .mods {
    list-style: none;
    margin: 14px 0 10px;
    padding: 0;
    max-height: 208px;
    overflow: auto;
    border-top: 1px solid var(--line);
  }
  .mods li {
    padding: 9px 2px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .mods label { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .mods input { width: 15px; height: 15px; accent-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 12px 16px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0c1016;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .busy { margin-top: 18px; }
  .bar {
    height: 4px;
    border-radius: 2px;
    background: #232936;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 38%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    animation: slide 1.15s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-105%); }
    100% { transform: translateX(275%); }
  }
  .status {
    margin: 12px 0 6px;
    font-size: 13px;
    color: var(--text);
  }
  .log {
    max-height: 132px;
    overflow: auto;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .log p { margin: 0; }
</style>
</head>
<body>
<main class="card">
  <h1>Live2D-Ai</h1>
  <p class="tagline">进入前确认：只影响本次进入，不写配置。</p>

  <div class="figures">
    <div class="figure"><span class="figure-label">已注册</span><strong id="num-registered">0</strong></div>
    <div class="figure"><span class="figure-label">本次确认</span><strong id="num-confirmed">0</strong></div>
    <div class="figure"><span class="figure-label">本次拉起</span><strong id="num-launch">0</strong></div>
  </div>

  <div class="row">
    <label class="switch"><input id="prestart" type="checkbox"><span>预启动</span></label>
    <p id="prestart-hint" class="hint">预启动关着：只确认，不拉起进程。</p>
  </div>

  <ul id="mods" class="mods"></ul>
  <p id="mods-empty" class="hint" hidden>没有已注册的 Mod（工厂 0）。仍可进入。</p>
  <p class="hint">勾选只在点「进入」后生效。</p>

  <button id="enter" type="button">进入</button>

  <section id="busy" class="busy" hidden>
    <div class="bar"><div class="bar-fill"></div></div>
    <p id="status" class="status">正在读取 Mod 列表…</p>
    <div id="log" class="log"></div>
  </section>
</main>
<script>
(function () {
  "use strict";

  var LAUNCH_IDS = ["local-tts-melo", "local-engine"];
  var PROBE_TIMEOUT_MS = 1500;
  var SETTLE_MS = 2000;
  var SECTIONS = [
    { key: "llm", label: "本次对话", test: "/api/v1/settings/test/llm" },
    { key: "tts", label: "本次语音", test: "/api/v1/settings/test/tts" }
  ];

  var mods = [];
  var busy = false;

  function byId(id) { return document.getElementById(id); }

  function setText(id, text) { byId(id).textContent = text; }

  function log(text) {
    var line = document.createElement("p");
    line.textContent = text;
    byId("log").appendChild(line);
    byId("log").scrollTop = byId("log").scrollHeight;
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function isLaunch(id) { return LAUNCH_IDS.indexOf(id) >= 0; }

  function checkedIds() {
    var out = [];
    var boxes = document.querySelectorAll("#mods input[type=checkbox]");
    for (var i = 0; i < boxes.length; i += 1) {
      if (boxes[i].checked) out.push(boxes[i].getAttribute("data-id"));
    }
    return out;
  }

  function updateNumbers() {
    var checked = checkedIds();
    var launch = 0;
    var prestart = byId("prestart").checked;
    for (var i = 0; i < checked.length; i += 1) {
      if (prestart && isLaunch(checked[i])) launch += 1;
    }
    setText("num-registered", String(mods.length));
    setText("num-confirmed", String(checked.length));
    setText("num-launch", String(launch));
    setText(
      "prestart-hint",
      prestart
        ? "预启动开着：勾选的拉起类 Mod 会生进程。"
        : "预启动关着：只确认，不拉起进程。"
    );
  }

  function renderMods() {
    var box = byId("mods");
    box.textContent = "";
    for (var i = 0; i < mods.length; i += 1) {
      var item = mods[i];
      var row = document.createElement("li");
      var label = document.createElement("label");
      var box2 = document.createElement("input");
      box2.type = "checkbox";
      box2.setAttribute("data-id", item.id);
      box2.addEventListener("change", updateNumbers);
      label.appendChild(box2);
      label.appendChild(document.createTextNode(" " + item.id));
      row.appendChild(label);
      box.appendChild(row);
    }
    byId("mods-empty").hidden = mods.length !== 0;
    updateNumbers();
  }

  function readJson(url, options) {
    return fetch(url, options || { method: "GET" }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        if (text) {
          try { data = JSON.parse(text); } catch (err) { data = null; }
        }
        return { status: res.status, ok: res.ok, data: data };
      });
    });
  }

  function loadMods() {
    return readJson("/api/v1/mods").then(function (res) {
      if (!res.ok || !res.data || !Array.isArray(res.data.mods)) {
        throw new Error("HTTP " + res.status);
      }
      mods = res.data.mods;
      renderMods();
      return mods;
    });
  }

  function postMod(id, action) {
    return fetch("/api/v1/mods/" + encodeURIComponent(id) + "/" + action, {
      method: "POST"
    }).then(function (res) {
      if (!res.ok) {
        log("Mod " + id + " " + (action === "enable" ? "启用失败（HTTP " : "停用失败（HTTP ") + res.status + "）");
      }
    }).catch(function () {
      log("Mod " + id + " 请求失败。");
    });
  }

  function findMod(list, id) {
    for (var i = 0; i < list.length; i += 1) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  function settleEnabled(ids) {
    var deadline = Date.now() + SETTLE_MS;
    function poll() {
      return loadMods().then(function (list) {
        var starting = false;
        for (var i = 0; i < ids.length; i += 1) {
          var item = findMod(list, ids[i]);
          if (item && item.status === "starting") starting = true;
        }
        if (!starting || Date.now() >= deadline) return list;
        return sleep(200).then(poll);
      }).catch(function () { return mods; });
    }
    return poll();
  }

  function outcomeText(data) {
    if (!data) return "不可达";
    if (data.ok) return "可达";
    var code = data.error && data.error.code ? data.error.code : "";
    if (code === "auth_failed") return "鉴权失败";
    if (code === "llm_unreachable" || code === "tts_unreachable") return "未配置";
    return "不可达";
  }

  function probeOne(section, status) {
    var configured = status && status[section.key] && status[section.key].configured;
    if (!configured) {
      log(section.label + "：未配置");
      return Promise.resolve();
    }
    return readJson(section.test, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ timeout_ms: PROBE_TIMEOUT_MS })
    }).then(function (res) {
      log(section.label + "：" + outcomeText(res.data));
    }).catch(function () {
      log(section.label + "：不可达");
    });
  }

  function runProbes() {
    setText("status", "正在探测本次对话与本次语音…");
    return readJson("/api/v1/app/status").then(function (res) {
      return res.ok ? res.data : null;
    }).catch(function () {
      return null;
    }).then(function (status) {
      return SECTIONS.reduce(function (chain, section) {
        return chain.then(function () { return probeOne(section, status); });
      }, Promise.resolve());
    });
  }

  function applyMods() {
    var enabledNow = [];
    return loadMods().catch(function () {
      log("读取 Mod 列表失败，跳过 Mod 步骤。");
      return mods;
    }).then(function (list) {
      var checked = checkedIds();
      var jobs = [];
      for (var i = 0; i < list.length; i += 1) {
        var item = list[i];
        var want = checked.indexOf(item.id) >= 0;
        if (isLaunch(item.id) && !byId("prestart").checked) want = false;
        if (want && !item.enabled) {
          enabledNow.push(item.id);
          jobs.push(postMod(item.id, "enable"));
        } else if (!want && item.enabled) {
          jobs.push(postMod(item.id, "disable"));
        }
      }
      return Promise.all(jobs).then(function () { return enabledNow; });
    }).then(function (ids) {
      if (ids.length === 0) return;
      setText("status", "正在等待 Mod 状态…");
      return settleEnabled(ids).then(function (list) {
        for (var i = 0; i < ids.length; i += 1) {
          var item = findMod(list, ids[i]);
          if (item && item.status === "failed") {
            var why = item.last_error ? String(item.last_error) : "未知原因";
            log("Mod " + item.id + " 启动失败：" + why);
          }
        }
      });
    });
  }

  function enter() {
    if (busy) return;
    busy = true;
    byId("enter").disabled = true;
    byId("busy").hidden = false;
    setText("status", "正在应用本次确认…");

    applyMods().catch(function () {
      log("有步骤失败，仍继续进入…");
    }).then(runProbes).catch(function () {
      log("探测失败，仍继续进入…");
    }).then(function () {
      setText("status", "探测完成，正在进入…");
      return sleep(650);
    }).then(function () {
      window.location.assign("/app/");
    });
  }

  byId("prestart").addEventListener("change", updateNumbers);
  byId("enter").addEventListener("click", enter);

  loadMods().catch(function () {
    setText("status", "读取 Mod 列表失败。");
    log("读取 Mod 列表失败，稍后可重试进入。");
  });
})();
</script>
</body>
</html>
