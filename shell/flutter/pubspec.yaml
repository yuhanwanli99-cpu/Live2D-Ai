name: live2d_ai_shell
description: "Live2D-Ai 的 Flutter Web 前端外壳（渲染面协议 v1）。"
publish_to: 'none'
# 与后端 `Cargo.toml` 的 `version` 对齐（0.2.0-rc.5）。
# `+8` 是 Flutter 的 build number，与后端版本语义无关——后端只按 capabilities 的
# `version` 字段（= `env!("CARGO_PKG_VERSION")`）报自己，前端不参与版本协商。
version: 0.2.3-rc.2+17

environment:
  sdk: ^3.13.3

# 运行时外部依赖仅 http + web（见 shell/README.md「依赖约束」）。
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 防抖 / 节流这类"时间行为"要在 VM 上确定性验证（假时钟），不能靠 sleep 赌
  # 调度。它随 flutter_test 一起进 lock（本来就是它的传递依赖），这里只是显式化。
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    # OFL-1.1 条件 2：再分发字体必须随附版权声明与许可，故让它随产物一起走。
    - assets/fonts/OFL.txt
  fonts:
    # 自托管中文子集，替代 Flutter 的 fonts.gstatic.com 缺字回落——见
    # assets/fonts/README.md。断网可用是本项目的硬要求（本地优先的桌宠）。
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-AiSubset-Regular.woff2
          weight: 400
        - asset: assets/fonts/NotoSansSC-AiSubset-Bold.woff2
          weight: 700
