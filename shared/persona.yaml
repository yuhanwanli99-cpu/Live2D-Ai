# Live2D-Ai — Gentle Cute Girl Persona 「白 (Bai)」 (Shared / Cross-Platform)
# ============================================================
# This file is the SINGLE SOURCE OF TRUTH for character persona.
#
# Referenced by:
#   - Desktop:  Live2D-Ai-pc/open-llm-vtuber/conf.yaml via load_persona_from_file
#   - Android:  assets/persona.yaml (sync from this file)
