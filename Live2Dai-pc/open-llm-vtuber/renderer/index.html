<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Live2Dai — 凛</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent; /* 透明背景：配合 Electron/Tauri 桌面壳实现悬浮桌宠 */
      }
      #canvas {
        width: 100%;
        height: 100%;
      }
      #canvas canvas {
        display: block;
      }

      /* ── 聊天面板（spoq-fix：直播/微信风格，右侧半透明） ── */
      .chat-panel {
        position: fixed;
        right: 16px;
        top: 16px;
        bottom: 16px;
        width: 320px;
        display: flex;
        flex-direction: column;
        background: rgba(20, 20, 28, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        z-index: 100;
        overflow: hidden;
      }
      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .chat-title {
        color: #f5f5f7;
        font-size: 13px;
        font-weight: 600;
      }
      .chat-status {
        color: #ff6b6b;
        font-size: 11px;
      }
      .chat-status-ok {
        color: #4ade80;
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .chat-msg {
        display: flex;
      }
      .chat-msg-user {
        justify-content: flex-end;
      }
      .chat-msg-assistant,
      .chat-msg-system {
        justify-content: flex-start;
      }
      .chat-msg-error {
        justify-content: center;
      }
      .chat-bubble {
        max-width: 82%;
        padding: 7px 11px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
      }
      .chat-msg-user .chat-bubble {
        background: rgba(99, 102, 241, 0.85);
        color: #fff;
        border-bottom-right-radius: 3px;
      }
      .chat-msg-assistant .chat-bubble {
        background: rgba(255, 255, 255, 0.14);
        color: #eee;
        border-bottom-left-radius: 3px;
      }
      .chat-msg-system .chat-bubble {
        background: transparent;
        color: #aaa;
        font-size: 11px;
        text-align: center;
      }
      .chat-msg-error .chat-bubble {
        background: rgba(239, 68, 68, 0.25);
        color: #fca5a5;
        font-size: 12px;
        text-align: center;
      }
      .chat-input-row {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .chat-input {
        flex: 1;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
        color: #f0f0f2;
        font-size: 13px;
        outline: none;
      }
      .chat-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }
      .chat-input:focus {
        border-color: rgba(99, 102, 241, 0.6);
      }
      .chat-send {
        padding: 8px 16px;
        border-radius: 10px;
        border: none;
        background: #6366f1;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
      }
      .chat-send:hover {
        background: #4f52e0;
      }
      .chat-send:active {
        background: #3f42c8;
      }
    </style>
    <!-- Cubism 4 Core：必须早于 main.ts 加载（pixi-live2d-display 依赖全局 live2dcubismcore） -->
    <script src="./libs/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div id="canvas"></div>
    <div id="chat"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
