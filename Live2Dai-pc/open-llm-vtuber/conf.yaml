# Live2Dai — 独立直连 API 模式配置（精简版）
# ===========================================================
# 保留清单: zhipu_free_llm(零配置默认) | deepseek_llm(升级路径) | zhipu_llm | edge_tts | faster_whisper | silero_vad
# 不走任何中间 Gateway，直接调 DeepSeek API (对话) 和 智谱 API (视觉/免费兜底对话)
# ===========================================================
# 零配置默认：conversation_agent_choice 的 llm_provider 默认指向 zhipu_free_llm
# （免费 GLM-4.7-Flash 兜底聊天，与 Android 端体验一致）。其 llm_api_key 使用
# ${ZHIPU_API_KEY} 环境变量占位符——未设置该环境变量时，代码层（free_glm_defaults.py）
# 会回退到内置的共享免费 Key，实现开箱即用；设置了环境变量则优选用你自己的 Key。

system_config:
  conf_version: 'v1.2.1'
  host: '0.0.0.0'
  port: 12393
  live2d_fps: 120
  config_alts_dir: 'characters'
  tool_prompts:
    live2d_expression_prompt: 'live2d_expression_prompt'
    mcp_prompt: 'mcp_prompt'

character_config:
  conf_name: 'bai'
  conf_uid: 'bai_001'
  live2d_model_name: 'bai'
  character_name: '白'
  avatar: 'mao.png'
  human_name: 'Human'
  load_persona_from_file: 'shared/persona.yaml'

  agent_config:
    conversation_agent_choice: 'basic_memory_agent'
    agent_settings:
      basic_memory_agent:
        # 默认 DeepSeek（本地 .env 配置 DEEPSEEK_API_KEY；密钥不提交）。
        # 也可改为 'zhipu_free_llm' 并配置自己的 ZHIPU_API_KEY。
        llm_provider: 'deepseek_llm'
        faster_first_response: true
        segment_method: 'priority'
        use_mcpp: false
        mcp_enabled_servers: []

    llm_configs:
      # 零配置默认聊天 Provider：免费 GLM-4.7-Flash（与 Android 端默认一致）。
      # llm_api_key 为 ${ZHIPU_API_KEY} 占位符；未设置该环境变量时由
      # free_glm_defaults.py 回退到内置共享免费 Key（开箱即用）。
      zhipu_free_llm:
        llm_api_key: '${ZHIPU_API_KEY}'
        model: 'glm-4.7-flash'
        temperature: 0.8

        base_url: https://open.bigmodel.cn/api/paas/v4
      deepseek_llm:
        llm_api_key: '${DEEPSEEK_API_KEY}'
        model: 'deepseek-v4-flash'
        temperature: 0.8

        base_url: https://api.deepseek.com/v1
      qwen_llm:
        llm_api_key: '${DASHSCOPE_API_KEY}'
        base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
        model: 'qwen3.7-flash'
        temperature: 0.8

      zhipu_llm:
        llm_api_key: '${ZHIPU_API_KEY}'
        model: 'glm-4.6v'
        temperature: 1

        base_url: https://open.bigmodel.cn/api/paas/v4
      openrouter:
        llm_api_key: ${OPENROUTER_API_KEY}
        model: openrouter/auto
        base_url: https://openrouter.ai/api/v1
        temperature: 0.8
      openai:
        llm_api_key: ${OPENAI_API_KEY}
        model: gpt-5
        base_url: https://api.openai.com/v1
        temperature: 0.8
      anthropic:
        llm_api_key: ${ANTHROPIC_API_KEY}
        model: claude-sonnet-4-5
        base_url: https://api.anthropic.com/v1
        temperature: 0.8
      moonshot:
        llm_api_key: ${MOONSHOT_API_KEY}
        model: moonshot-v1-8k
        base_url: https://api.moonshot.cn/v1
        temperature: 0.8
      groq:
        llm_api_key: ${GROQ_API_KEY}
        model: llama-3.3-70b-versatile
        base_url: https://api.groq.com/openai/v1
        temperature: 0.8
      mistral:
        llm_api_key: ${MISTRAL_API_KEY}
        model: mistral-large-latest
        base_url: https://api.mistral.ai/v1
        temperature: 0.8
      together:
        llm_api_key: ${TOGETHER_API_KEY}
        model: meta-llama/Llama-3.3-70B-Instruct-Turbo
        base_url: https://api.together.xyz/v1
        temperature: 0.8
      fireworks:
        llm_api_key: ${FIREWORKS_API_KEY}
        model: accounts/fireworks/models/llama-v3p3-70b-instruct
        base_url: https://api.fireworks.ai/inference/v1
        temperature: 0.8
      siliconflow:
        llm_api_key: ${SILICONFLOW_API_KEY}
        model: deepseek-ai/DeepSeek-V3
        base_url: https://api.siliconflow.cn/v1
        temperature: 0.8
      opencode:
        llm_api_key: ${OPENCODE_API_KEY}
        temperature: 0.8
      opencode_go:
        llm_api_key: ${OPENCODE_GO_API_KEY}
        temperature: 0.8
      openai_compatible:
        llm_api_key: ${OPENAI_API_KEY}
        temperature: 0.8
  asr_config:
    asr_model: 'faster_whisper'  # P0: 启用本地 Faster-Whisper 语音输入；如无模型可改回 disabled
    faster_whisper:
      model_path: 'large-v3-turbo'
      download_root: 'models/whisper'
      language: 'zh'
      device: 'auto'
      compute_type: 'int8'
      prompt: ''

  tts_config:
    tts_model: 'cosyvoice_cloud'
    concurrency_limit: 2  # 段级 TTS 合成并发上限（spoq-fix P2-3）
    cosyvoice_cloud:
      api_key: ''
      model: 'cosyvoice-v1'
      ws_url: 'wss://ws-s8erlxkb5f8b1j59.cn-beijing.maas.aliyuncs.com/api-ws/v1/inference'
    qwen_tts:
      api_key: '${DASHSCOPE_API_KEY}'
      voice: 'Cherry'
      model: 'qwen3-tts-flash'
    edge_tts:
      voice: 'zh-CN-XiaoxiaoNeural'

    openai_tts: {}
    azure_tts: {}
    minimax_tts: {}
    siliconflow_tts: {}
    fish_api_tts: {}
    spark_tts: {}
    gpt_sovits: {}
    piper: {}
    sherpa_onnx: {}
    pyttsx3: {}
  vad_config:
    vad_model:
    silero_vad:
      orig_sr: 16000
      target_sr: 16000
      prob_threshold: 0.4
      db_threshold: 60
      required_hits: 3
      required_misses: 24
      smoothing_window: 5

  tts_preprocessor_config:
    remove_special_char: true
    ignore_brackets: true
    ignore_parentheses: true
    ignore_asterisks: true
    ignore_angle_brackets: true
    translator_config:
      translate_audio: false
      translate_provider: 'deeplx'

vision_config:
  vision_enabled: false
  provider: 'zhipu'
  api_key: '${ZHIPU_API_KEY}'
  model: 'glm-4.6v'
  capture_interval: 5.0

# MCP 服务定义: 直接指向跨端共享定义文件（零配置，无需本地手工创建 mcp_servers.json）
mcp_servers: 'shared/mcp_tools.json'
