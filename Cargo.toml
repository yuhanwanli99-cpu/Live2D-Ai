# Live2D-Ai — Rust 重建 workspace（第一批，2026-08）
# 仅含 Rust 重建的 crate；旧项目（Live2D-Ai-pc / Live2D-Ai-Android）不在 workspace 内，互不影响。
# 本文件为根清单，无 package（根不产 crate）。

[workspace]
resolver = "2"
members = [
    "crates/l2d",
    "crates/live2d-ai-core",
    "crates/live2d-ai-desktop",
    "crates/live2d-ai-runtime",
    "crates/l2d-wasm-demo",
    "crates/live2d-ai-mod-system",
    "crates/live2d-ai-mod-external-input",
    # rc.4 M5：角色卡标准 Mod（酒馆 V1/V2 JSON + PNG chara → 合成 system_prompt）。
    "crates/live2d-ai-mod-persona",
    # rc.4 M3：新 Mod 模板（不注册进 AVAILABLE_MOD_FACTORIES，只作为复制起点 + 活文档）。
    "crates/live2d-ai-mod-template",
    # Wave 1（2026-09-14）：语音输入 Mod 骨架（语音转写 → 清洗 → say_tx）。
    "crates/live2d-ai-mod-voice-input",
    # Wave 2 C 轨（2026-09-14）：本地记忆 v0（JSONL + 词元重叠检索 → 注入 persona.system_prompt）。
    "crates/live2d-ai-mod-memory",
    # Wave 3 G 轨（2026-09-14）：导演最小骨架（正文 → 情绪/意图/TTS 建议；只记日志 + state_json，
    # 不投递）。**收束时由主 agent** 注册进 FACTORIES（6 → 7），缺省停用。
    "crates/live2d-ai-mod-director",
    # 2026-10-09「两类 TTS」：本地拉起 Mod（id `local-tts`）。**只**按用户 argv
    # spawn 外部进程；缺省停用、不写 `[tts]`、不改出声地址。
    "crates/live2d-ai-mod-local-tts",
    "xtask",
]

# 第一批基础元数据，各成员可覆盖（如 crates/l2d 的 license 覆盖为 MIT OR Apache-2.0）
[workspace.package]
# 2026-09-11 版本线重置：0.5.1 → 0.1.0-rc.1。
# 理由是「核心链路基线」不是 0.5.x 线上的又一次增量，而是**重新起算的第一个对外候选版**：
# LLM 工具 + 动作系统从前后端整体拆除（LLM 只做对话）、音频改走 `<audio>` 媒体元素、
# 句界契约改由引擎给出。按 0.5.2 递增会让「拆除」看起来像小修补，故重置到 0.1.0 线的 RC。
# 唯一真源：各 crate 用 `version.workspace = true` 继承，代码经 `env!("CARGO_PKG_VERSION")`
# 编译期固化并暴露到 `/api/v1/app/capabilities` 的 `version` 字段。
#
# 2026-09-12（rc.2「第二基线」）：动作层删到底（director Mod + Action 注入 + 渲染面编舞）、
# 模型库闭环打通（单一模型根 + 激活即换皮）、`.env` 成为唯一密钥真源。范围见
# `docs/plans/PLAN-rc2-second-baseline-2026-09-12.md` §0；发布说明见
# 2026-09-13（rc.4「Mod 产品链路 + 主链人设收敛」）：Mod 成为产品链路
# （持久化 / settings_spec 表单 / 模板 + api_version 门禁 / 一等 apply_settings）、
# 角色卡从主链抽成标准 Mod、主链 `[persona]` 只留 system_prompt。
# 范围见 `docs/plans/PLAN-rc4-mod-product-chain-2026-09-13.md`；
# 发布说明见 `docs/releases/v0.1.0-rc.4.md`。
#
# 2026-09-14（rc.5「壳全局背景 + 与舞台同步」）：DisplayPrefs 增加 `shellImage` /
# `syncShellStageBg`（默认跟随舞台）；壳根铺一层**固定 0.15 透明度**的全局背景，
# 聊天 / 侧栏保持可读。背景只住本机 DisplayPrefs / localStorage——不写
# `live2d-ai.toml`、不做分区背景 / 轮播 / 在线拉图。
# 发布说明见 `docs/releases/v0.1.0-rc.5.md`。
#
# 2026-09-14（0.2.0-rc.1「Mod 纪元第一基线」）：外部事件（直播弹幕/礼物）成为
# 一等刚需——`POST /api/v1/external/chat` 契约 + `external-input` Mod 加强
# （静态 settings_spec / 模板前缀 / 启停门禁）+ Windows sidecar 示例（B 站 blivedm，
# 抓取**不在主仓**）；**local-llm 废除启动**（移出 FACTORIES，4→3）；Mod 社区许可
# 与分发门槛明文。主链皮肤（LLM/TTS/口型/Live2D、壳/舞台背景）冻结未改。
# 发布说明见 `docs/releases/v0.2.0-rc.1.md`；契约见 `docs/external-input.md`。
#
# 2026-09-14（0.2.0-rc.2「Wave 1 三轨合成」）：把三条并行 Mod 轨道
# （persona-polish / voice-input / wallpaper）合成一条集成分支；FACTORIES 3→5
# （+ voice-input / + wallpaper，均**缺省停用**），`mod_count_is_five` 守住数字。
# 主链皮肤与 `l2d-wasm-demo` / framebuffer / 背景实现**未改**。
# 发布说明见 `docs/releases/v0.2.0-rc.2.md`。
#
# 2026-09-14（0.2.0-rc.3「Wave 2 五轨合成」）：让能力从「能编译」变「能演示」——
# 语音专用端点 `POST /api/v1/voice/transcript` + 可跑 sidecar（ASR 不进 Rust）；
# 壁纸决策真落 `DisplayPrefs`（占位删除）；新 crate `memory`（本地 JSONL + 检索注入
# 下一轮 system_prompt）；导演 RFC 契约先行（**不注册**）；桌宠配置/事件态进 API 可测面。
# 基座新增 `ModEventTopic::TurnPrompt` / `ModRuntime::state_json` /
# `GET /api/v1/mods/{id}/state`。FACTORIES 5→6（+ memory，缺省停用），
# `mod_count_is_six` 守住数字。主链皮肤与 `l2d-wasm-demo` / framebuffer **未改**。
# 发布说明见 `docs/releases/v0.2.0-rc.3.md`。
#
# 2026-09-26（0.2.0-rc.4「表演协议 v1 全链 + 导演可观测 + 单模型动作强度」）：0.2.0 线**最后一个 RC**。
# ① 阶段3 单一驱动者：退役「前端拉 `latest.preset_id` 驱动舞台」，动作只由 WS `action_cue` 驱动，
# `preset_id=="none"` = 撤销哨兵、`cues:[]` = 本轮不动（D10–D13）。
# ② 阶段4 表演协议 v1：`speak` 退役为 `segments`（只切分原文、逐字不变）、三表演字段
# `body`/`head`/`expression`、唯一时间基准 = 音频播放时钟（`stage-clock`）、渲染面事件级 ack 四条 +
# `segment-ended`、会话 baseline（D22–D39）。
# ③ 阶段5：dev_mode「导演可观测」四栏 + 单模型动作强度 `[action.models.<id>]`（D40–D48）。
# 既有帧/字段一律不删（V11）。发布说明见 `docs/releases/v0.2.0-rc.4.md`。
#
# 2026-10-10（0.2.3-rc.2 → 0.2.4-rc.1「本机出声接上 + 待机开关 + 设置草稿 + 渲染档位」）：
# ① `melo/start.sh` 可复现安装（Python 3.10 重建 venv + 三处幂等补丁 + BERT 落 `.cache`），
# 8091 真的应答、浏览器出声；② `PoseStack.idle_enabled` 连每帧摆动一起停 + 物理并入导演角度，
# `load_model` 不再丢开关；③ 本机偏好改**草稿**，底部「保存并重载」一次提交；
# ④ 渲染档位 = 画布**最长边**（4096/8192/16384，不撑正方形）+ 运行期逐级降级；
# ⑤ spawn 出的本地 TTS 子进程装 `PR_SET_PDEATHSIG`（父死即收）+ ignite 预检清残留孤儿。
# 发布说明见 `docs/releases/v0.2.4-rc.1.md`。
version = "0.2.4-rc.1"
edition = "2024"
# 2026-08-26 修正：1.85 → 1.87——wgpu 29（ayagami-render 底座同大版本）的 MSRV 为
# 1.87，1.85 低于依赖实际下限；wasm 演示 crate 同样按此下限声明。
# 2026-08-31 再修正：1.87 → 1.92——egui 0.35 全家（egui/egui-winit/egui-wgpu）
# 要求 rustc 1.92（实测 `cargo +1.87 check` 报 1.92 上限）；1.87 是假下限。
rust-version = "1.92"
license = "AGPL-3.0-only"
authors = ["Sakura Motion Project"]

# rustfmt/clippy 基础设置（rustfmt 细则见根 rustfmt.toml）
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"