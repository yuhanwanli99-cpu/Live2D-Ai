# Live2D-Ai — Rust 重建 workspace（第一批，2026-08）
# 仅含 Rust 重建的 crate；旧项目（Live2D-Ai-pc / Live2D-Ai-Android）不在 workspace 内，互不影响。
# 本文件为根清单，无 package（根不产 crate）。

[workspace]
resolver = "2"
members = [
    "crates/l2d",
    "crates/live2d-ai-core",
    "crates/live2d-ai-desktop",
    "crates/live2d-ai-runtime",
    "crates/l2d-wasm-demo",
    "crates/live2d-ai-mod-system",
    "crates/live2d-ai-mod-external-input",
    "crates/live2d-ai-mod-director",
    "crates/live2d-ai-mod-pet-desktop",
    "crates/live2d-ai-mod-local-llm",
    "crates/live2d-ai-mod-local-tts",
    "xtask",
]

# 第一批基础元数据，各成员可覆盖（如 crates/l2d 的 license 覆盖为 MIT OR Apache-2.0）
[workspace.package]
version = "0.4.13"
edition = "2024"
# 2026-08-26 修正：1.85 → 1.87——wgpu 29（ayagami-render 底座同大版本）的 MSRV 为
# 1.87，1.85 低于依赖实际下限；wasm 演示 crate 同样按此下限声明。
# 2026-08-31 再修正：1.87 → 1.92——egui 0.35 全家（egui/egui-winit/egui-wgpu）
# 要求 rustc 1.92（实测 `cargo +1.87 check` 报 1.92 上限）；1.87 是假下限。
rust-version = "1.92"
license = "AGPL-3.0-only"
authors = ["Sakura Motion Project"]

# rustfmt/clippy 基础设置（rustfmt 细则见根 rustfmt.toml）
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"